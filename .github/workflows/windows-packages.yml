name: Windows packages

on:
  workflow_dispatch:
    inputs:
      scoop_base_url:
        description: Optional public download directory for the generated Scoop manifest
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CRAFT_ROOT: C:\CraftRoot
      SCOOP_BASE_URL: ${{ inputs.scoop_base_url }}
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Craft downloads and dependency binaries
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: C:/CraftRoot/download
          key: windows-2022-craft-downloads-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: windows-2022-craft-downloads-v1-

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Bootstrap KDE Craft (MSVC 2022, x64)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/initialize-craft-path.ps1
          git config --global core.longpaths true
          if ($LASTEXITCODE) { throw 'Failed to enable long paths' }
          $bootstrap = Join-Path $env:RUNNER_TEMP 'craft-bootstrap'
          git clone --depth 1 https://invent.kde.org/packaging/craft.git $bootstrap
          if ($LASTEXITCODE) { throw 'Failed to download Craft' }
          Start-Transcript -Path "$env:RUNNER_TEMP/craft-bootstrap.log"
          try {
            python -u "$bootstrap/setup/CraftBootstrap.py" --prefix $env:CRAFT_ROOT --use-defaults --localDev $bootstrap
            if ($LASTEXITCODE) { throw 'Craft bootstrap failed; see craft-bootstrap.log and Craft logs' }
            python -c "import configparser, os; c=configparser.ConfigParser(); c.read(os.path.join(os.environ['CRAFT_ROOT'], 'etc', 'CraftSettings.ini')); assert c['General']['ABI'] == 'windows-cl-msvc2022-x86_64'; assert c['Compile']['BuildType'] == 'RelWithDebInfo', 'Unexpected bootstrap build type'"
            if ($LASTEXITCODE) { throw 'Unexpected Craft desktop build configuration' }
          } finally {
            Stop-Transcript
          }

      - name: Build checkout and package installer and portable archive
        run: ./.github/scripts/build-windows.ps1

      - name: Save Craft downloads even if bootstrap or packaging failed
        if: always() && !cancelled() && steps.downloads.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:/CraftRoot/download
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Upload packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Collect Craft logs on failure
        if: failure()
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'craft-diagnostics'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          if (Test-Path "$env:CRAFT_ROOT/logs") {
            Copy-Item "$env:CRAFT_ROOT/logs" "$diagnostics/logs" -Recurse -Force
          }
          if (Test-Path "$env:RUNNER_TEMP/craft-bootstrap.log") {
            Copy-Item "$env:RUNNER_TEMP/craft-bootstrap.log" $diagnostics -Force
          }

      - name: Upload Craft logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: craft-logs-${{ github.sha }}
          path: ${{ runner.temp }}/craft-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
