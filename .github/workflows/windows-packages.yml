name: Windows packages

on:
  workflow_dispatch:
    inputs:
      scoop_base_url:
        description: Optional public download directory for the generated Scoop manifest
        required: false
        type: string
      cache_revision:
        description: Increase when changing Craft, toolchain, or dependency configuration
        default: '1'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CRAFT_ROOT: C:\CraftRoot
      CRAFT_SNAPSHOT_FILE: C:\CraftEnvironment\environment.tar.zst
      SCOOP_BASE_URL: ${{ inputs.scoop_base_url }}
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - name: Identify runner image for the environment cache
        id: cache-id
        run: |
          if (-not $env:ImageVersion) { throw 'Runner image version is unavailable' }
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore installed Craft and dependencies
        id: environment
        uses: actions/cache/restore@v4
        with:
          path: C:/CraftEnvironment/environment.tar.zst
          # Application build and validation edits do not change the dependency environment.
          key: craft-env-v1-${{ steps.cache-id.outputs.image }}-py${{ steps.python.outputs.python-version }}-${{ inputs.cache_revision || '1' }}-desktop-msvc2022-relwithdebinfo
          # Reuse compatible snapshots saved with the previous script-hash keys.
          restore-keys: craft-env-v1-${{ steps.cache-id.outputs.image }}-py${{ steps.python.outputs.python-version }}-${{ inputs.cache_revision || '1' }}-

      - name: Restore directory junctions and refresh runner paths
        if: steps.environment.outputs.cache-matched-key != ''
        run: python .github/scripts/cache-craft-environment.py restore

      - name: Restore Craft downloads and dependency binaries
        if: steps.environment.outputs.cache-matched-key == ''
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: C:/CraftRoot/download
          key: windows-2022-craft-downloads-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: windows-2022-craft-downloads-v1-

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Bootstrap KDE Craft (MSVC 2022, x64)
        if: steps.environment.outputs.cache-matched-key == ''
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/initialize-craft-path.ps1
          git config --global core.longpaths true
          if ($LASTEXITCODE) { throw 'Failed to enable long paths' }
          $bootstrap = Join-Path $env:RUNNER_TEMP 'craft-bootstrap'
          git clone --depth 1 https://invent.kde.org/packaging/craft.git $bootstrap
          if ($LASTEXITCODE) { throw 'Failed to download Craft' }
          Start-Transcript -Path "$env:RUNNER_TEMP/craft-bootstrap.log"
          try {
            python -u "$bootstrap/setup/CraftBootstrap.py" --prefix $env:CRAFT_ROOT --use-defaults --localDev $bootstrap
            if ($LASTEXITCODE) { throw 'Craft bootstrap failed; see craft-bootstrap.log and Craft logs' }
            python -c "import configparser, os; c=configparser.ConfigParser(); c.read(os.path.join(os.environ['CRAFT_ROOT'], 'etc', 'CraftSettings.ini')); assert c['General']['ABI'] == 'windows-cl-msvc2022-x86_64'; assert c['Compile']['BuildType'] == 'RelWithDebInfo', 'Unexpected bootstrap build type'"
            if ($LASTEXITCODE) { throw 'Unexpected Craft desktop build configuration' }
          } finally {
            Stop-Transcript
          }

      - name: Install build and packaging dependencies
        if: steps.environment.outputs.cache-matched-key == ''
        run: ./.github/scripts/build-windows.ps1 -DependenciesOnly

      - name: Prepare dependency environment snapshot
        id: snapshot
        if: steps.environment.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python .github/scripts/cache-craft-environment.py save

      - name: Cache installed Craft and dependencies
        if: steps.environment.outputs.cache-hit != 'true' && steps.snapshot.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:/CraftEnvironment/environment.tar.zst
          key: ${{ steps.environment.outputs.cache-primary-key }}

      - name: Remove temporary environment archive
        if: always()
        run: |
          if (Test-Path $env:CRAFT_SNAPSHOT_FILE) {
            Remove-Item $env:CRAFT_SNAPSHOT_FILE -Force
          }

      - name: Build checkout and package installer and portable archive
        timeout-minutes: 30
        run: ./.github/scripts/build-windows.ps1 -SkipDependencies

      - name: Save Craft downloads even if bootstrap or packaging failed
        if: always() && !cancelled() && steps.downloads.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:/CraftRoot/download
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Upload packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Collect Craft logs on failure
        if: failure()
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'craft-diagnostics'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          if (Test-Path "$env:CRAFT_ROOT/logs") {
            Copy-Item "$env:CRAFT_ROOT/logs" "$diagnostics/logs" -Recurse -Force
          }
          if (Test-Path "$env:RUNNER_TEMP/craft-bootstrap.log") {
            Copy-Item "$env:RUNNER_TEMP/craft-bootstrap.log" $diagnostics -Force
          }
          Get-ChildItem "$env:TEMP/kdeconnect-portable-probe.*.log" -ErrorAction SilentlyContinue |
            Copy-Item -Destination $diagnostics -Force

      - name: Upload Craft logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: craft-logs-${{ github.sha }}
          path: ${{ runner.temp }}/craft-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
